---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: yev-os-silverblue
description: This is my personal image with updated graphics.
base-image: quay.io/fedora/fedora-silverblue
image-version: latest
modules:
  - type: files
    files:
    - source: system
      destination: /
  - from-file: base/kargs.yml
  - from-file: base/silverblue
  - from-file: base/rpmfusion.yml
  - from-file: base/applications.yml
  - from-file: base/post-build.yml

  - type: signing
